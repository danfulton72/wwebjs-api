name: wwebjs-api

services:
  api:
    image: ghcr.io/danfulton72/wwebjs-api:latest
    container_name: wwebjs-api
    restart: always
    stop_grace_period: 35s
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    volumes:
      - wwebjs_sessions:/usr/src/app/sessions
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const r=process.env.BASE_PATH||'/';const b=r==='/'?'':'/'+r.replace(/^\/+|\/+$/g,'');
          fetch('http://127.0.0.1:'+(process.env.PORT||3000)+b+'/health/ready')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: route Chromium (WhatsApp Web) traffic through an outbound proxy.
    # Set PROXY_URL (and optionally PROXY_USERNAME / PROXY_PASSWORD) in .env.
    # environment:
    #   PROXY_URL: http://tinyproxy:8888
    # depends_on:
    #   - tinyproxy

  # Optional proxy for local testing:
  # tinyproxy:
  #   image: vimagick/tinyproxy
  #   container_name: wwebjs-tinyproxy
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     ALLOWED_NETWORKS: 0.0.0.0/0
  #   restart: unless-stopped

volumes:
  wwebjs_sessions:
