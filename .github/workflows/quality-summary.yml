name: Quality Summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    name: Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Show quality commands
        run: |
          printf '%s\n' 'npm run lint' 'npm run test:coverage' 'npm run audit:prod' 'npm run sbom'
