name: CI/CD Pipeline for Docker Tag Push

on:
  push:
    tags:
      - "v*"
      - "edge"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install edge version of whatsapp-web.js
        if: github.ref_name == 'edge'
        run: npm install --save-exact github:pedroslopez/whatsapp-web.js#main
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
        timeout-minutes: 5
      - name: Audit production dependencies
        if: github.ref_name != 'edge'
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${{ github.ref_name }}" == "edge" ]]; then
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ github.ref_name }},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push with dynamic tag
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            USE_EDGE=${{ github.ref_name == 'edge' }}
          no-cache: ${{ github.ref_name == 'edge' }}
