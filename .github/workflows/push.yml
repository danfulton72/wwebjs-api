name: CI/CD Pipeline for Docker Tag Push

on:
  push:
    tags:
      - "v*"
      - "edge"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install edge version of whatsapp-web.js
        if: github.ref_name == 'edge'
        run: npm install --save-exact github:pedroslopez/whatsapp-web.js#main
      - name: Lint
        run: npm run lint
      - name: Run deterministic tests
        run: npm run test:coverage
        timeout-minutes: 5
      - name: Audit production dependencies
        if: github.ref_name != 'edge'
        run: npm run audit:prod
      - name: Generate application SBOM
        if: github.ref_name != 'edge'
        run: npm run sbom

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${{ github.ref_name }}" == "edge" ]]; then
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ github.ref_name }},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push with dynamic tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            USE_EDGE=${{ github.ref_name == 'edge' }}
          no-cache: ${{ github.ref_name == 'edge' }}
